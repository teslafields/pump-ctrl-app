# Console output over USB Serial / JTAG CDC ACM
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y

# Heap memory for display buffer allocation
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Display Subsystem & Drivers
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CFB_LOG_LEVEL_INF=y

# SSD1306 & I2C
CONFIG_SSD1306=y
CONFIG_I2C=y
